{% extends "scale/base.html" %}

{% block title %}Dashboard | IntelliScale{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto">
    <div class="bg-white shadow rounded-lg overflow-hidden border border-zinc-200">
        <div class="p-6">
            <h1 class="text-2xl font-semibold text-zinc-900 mb-4">Welcome, {{ username }}! (Role: {{ user.get_role_display }})</h1>
            <p class="text-zinc-600 mb-8">You are logged in. This is a default dashboard.</p>
        </div>
    </div>
</div>
{% endblock %}
